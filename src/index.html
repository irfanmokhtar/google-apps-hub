<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Google Workspace Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="sidebar">
    <!-- Drag region for window movement -->
    <div class="drag-region"></div>

    <!-- App logo/title -->
    <div class="logo-container">
      <div class="logo">G</div>
    </div>

    <!-- Service buttons -->
    <div class="nav-buttons">
      <button class="nav-btn active" data-service="drive" title="Google Drive">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M7.71 3.5L1.15 15l4.58 6.5h14.54l4.58-6.5L18.29 3.5H7.71zM12 6.5L6.5 15h11L12 6.5zm-1.71 10L6.5 21.5H4.29L8 15H3l6.29-9 2 3.5L12 6.5l1.71 3L12 16.5h-1.71z" />
        </svg>
        <span class="tooltip">Drive</span>
      </button>

      <button class="nav-btn" data-service="sheets" title="Google Sheets">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" />
          <path d="M7 7h4v4H7zm6 0h4v4h-4zm-6 6h4v4H7zm6 0h4v4h-4z" />
        </svg>
        <span class="tooltip">Sheets</span>
      </button>

      <button class="nav-btn" data-service="photos" title="Google Photos">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z" />
        </svg>
        <span class="tooltip">Photos</span>
      </button>

      <button class="nav-btn" data-service="keep" title="Google Keep">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z" />
        </svg>
        <span class="tooltip">Keep</span>
      </button>
    </div>

    <!-- Bottom spacer -->
    <div class="sidebar-footer"></div>
  </nav>

  <!-- Top Drag Bar -->
  <div class="top-bar">
    <div class="window-controls">
      <button id="btn-back" class="control-btn" title="Back">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <button id="btn-refresh" class="control-btn" title="Refresh">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
      </button>
    </div>
    <div class="top-bar-title">Google Workspace Hub</div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
