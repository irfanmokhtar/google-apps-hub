<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Home</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            /* Match main background */
            color: white;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 48px;
            background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            max-width: 800px;
            width: 100%;
        }

        .tile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Staggered animation delays */
        .tile:nth-child(1) {
            animation-delay: 0.1s;
        }

        .tile:nth-child(2) {
            animation-delay: 0.2s;
        }

        .tile:nth-child(3) {
            animation-delay: 0.3s;
        }

        .tile:nth-child(4) {
            animation-delay: 0.4s;
        }

        .tile:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .tile svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            transition: transform 0.3s ease;
        }

        .tile:hover svg {
            transform: scale(1.1);
        }

        .tile span {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Brand glow on hover */
        .tile[data-service="drive"]:hover {
            box-shadow: 0 12px 30px rgba(66, 133, 244, 0.2);
        }

        .tile[data-service="docs"]:hover {
            box-shadow: 0 12px 30px rgba(66, 133, 244, 0.2);
        }

        .tile[data-service="sheets"]:hover {
            box-shadow: 0 12px 30px rgba(52, 168, 83, 0.2);
        }

        .tile[data-service="photos"]:hover {
            box-shadow: 0 12px 30px rgba(234, 67, 53, 0.2);
        }

        .tile[data-service="keep"]:hover {
            box-shadow: 0 12px 30px rgba(251, 188, 5, 0.2);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <h1>Google Workspace Hub</h1>

    <div class="grid">
        <div class="tile" data-service="drive">
            <svg viewBox="0 0 24 24" fill="#4285f4">
                <path
                    d="M7.71 3.5L1.15 15l4.58 6.5h14.54l4.58-6.5L18.29 3.5H7.71zM12 6.5L6.5 15h11L12 6.5zm-1.71 10L6.5 21.5H4.29L8 15H3l6.29-9 2 3.5L12 6.5l1.71 3L12 16.5h-1.71z" />
            </svg>
            <span>Drive</span>
        </div>

        <div class="tile" data-service="docs">
            <svg viewBox="0 0 24 24" fill="#4285f4">
                <path
                    d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
            </svg>
            <span>Docs</span>
        </div>

        <div class="tile" data-service="sheets">
            <svg viewBox="0 0 24 24" fill="#34a853">
                <path
                    d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" />
                <path d="M7 7h4v4H7zm6 0h4v4h-4zm-6 6h4v4H7zm6 0h4v4h-4z" />
            </svg>
            <span>Sheets</span>
        </div>

        <div class="tile" data-service="photos">
            <svg viewBox="0 0 24 24" fill="#ea4335">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z" />
            </svg>
            <span>Photos</span>
        </div>

        <div class="tile" data-service="keep">
            <svg viewBox="0 0 24 24" fill="#fbbc05">
                <path
                    d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z" />
            </svg>
            <span>Keep</span>
        </div>
    </div>

    <script src="home-renderer.js"></script>
</body>

</html>
